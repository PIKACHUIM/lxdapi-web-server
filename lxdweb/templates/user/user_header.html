{{define "user/user_header.html"}}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
{{if .UseLocalCDN}}
<script src="/static/js/iconify.min.js"></script>
{{else}}
<script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
{{end}}

{{template "user/user_toast.html"}}

<style>
    /* 页面级过渡工具类：沿用既有命名，保证各业务页继续可用 */
    @keyframes gentlePulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.85; }
    }

    .animate-pulse-slow { animation: gentlePulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    .card-hover {
        transition: all 0.25s ease;
    }
    .card-hover:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px -8px rgba(0, 0, 0, 0.1);
    }

    .btn-hover {
        transition: all 0.25s ease;
    }
    .btn-hover:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .btn-hover:active {
        transform: translateY(0);
    }

    .smooth-transition {
        transition: all 0.25s ease;
    }
</style>

<header class="qz-topbar">
    <div class="qz-shell qz-topbar-inner">
        <a href="/user/containers" class="qz-brand">
            <span class="qz-brand-logo">
                <span class="iconify" data-icon="mdi:cloud-outline" data-width="18" data-height="18"></span>
            </span>
            <span class="qz-brand-text">
                <strong>{{ .SystemName }}</strong>
                <em>Cloud Console</em>
            </span>
        </a>

        <div class="qz-topbar-actions">
            <span class="qz-userchip">
                <span class="iconify" data-icon="mdi:account-circle" data-width="16" data-height="16"></span>
                <span>{{.username}}</span>
            </span>
            <button type="button" onclick="logout()" class="qz-iconbtn qz-iconbtn-danger" title="退出登录" aria-label="退出登录">
                <span class="iconify" data-icon="mdi:logout" data-width="18" data-height="18"></span>
            </button>
        </div>
    </div>
</header>

<div class="qz-crumbbar">
    <div class="qz-shell qz-crumbbar-inner">
        <nav class="qz-crumb" aria-label="面包屑">
            <a href="/user/containers">Home</a>
            <i>/</i>
            <span>{{ .SystemName }}</span>
            <i>/</i>
            <b data-qz-current-page>我的实例</b>
        </nav>
    </div>
</div>

<div class="qz-subbar">
    <div class="qz-shell qz-subbar-inner">
        <nav class="qz-tabs" aria-label="主导航">
            <a href="/user/containers" class="qz-tab" data-qz-nav>我的实例</a>
        </nav>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
function logout() {
    if (confirm('确定要退出登录吗？')) {
        $.ajax({
            url: '/api/user/logout',
            type: 'POST',
            success: function() {
                window.location.href = '/user/login';
            },
            error: function() {
                window.location.href = '/user/login';
            }
        });
    }
}

document.addEventListener('DOMContentLoaded', function() {
    var links = Array.prototype.slice.call(document.querySelectorAll('[data-qz-nav]'));
    var path = (window.location.pathname || '/').replace(/\/+$/, '') || '/';
    var best = null;
    var bestLen = -1;

    links.forEach(function(a) {
        var href = (a.getAttribute('href') || '').replace(/\/+$/, '') || '/';
        if (href === '/') return;
        if (path === href || path.indexOf(href + '/') === 0) {
            if (href.length > bestLen) {
                best = a;
                bestLen = href.length;
            }
        }
    });

    if (best) {
        best.classList.add('is-active');
        var group = best.closest('.qz-tabgroup');
        if (group) group.classList.add('is-active');

        var label = best.getAttribute('data-qz-label') || (best.textContent || '').trim();
        var slot = document.querySelector('[data-qz-current-page]');
        if (slot && label) slot.textContent = label;
    }
});
</script>
{{end}}
