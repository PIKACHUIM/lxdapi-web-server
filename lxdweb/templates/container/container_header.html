{{define "container/container_header.html"}}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
{{if .UseLocalCDN}}
<script src="/static/js/iconify.min.js"></script>
{{else}}
<script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
{{end}}

{{template "container/container_toast.html"}}

<style>
    /* 页面级过渡工具类：沿用既有命名，保证各业务页继续可用 */
    @keyframes gentlePulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.85; }
    }

    .animate-pulse-slow { animation: gentlePulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    .card-hover {
        transition: all 0.25s ease;
    }
    .card-hover:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px -8px rgba(0, 0, 0, 0.1);
    }

    .btn-hover {
        transition: all 0.25s ease;
    }
    .btn-hover:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .btn-hover:active {
        transform: translateY(0);
    }

    .smooth-transition {
        transition: all 0.25s ease;
    }
</style>

<header class="qz-topbar">
    <div class="qz-shell qz-topbar-inner">
        <a href="/container/dashboard" class="qz-brand">
            <span class="qz-brand-logo">
                <span class="iconify" data-icon="mdi:cube-outline" data-width="18" data-height="18"></span>
            </span>
            <span class="qz-brand-text">
                <strong>{{ .SystemName }}</strong>
                <em>Instance Console</em>
            </span>
        </a>

        <div class="qz-topbar-actions">
            <button type="button" onclick="logout()" class="qz-iconbtn qz-iconbtn-danger" title="退出登录" aria-label="退出登录">
                <span class="iconify" data-icon="mdi:logout" data-width="18" data-height="18"></span>
            </button>
        </div>
    </div>
</header>

<div class="qz-crumbbar">
    <div class="qz-shell qz-crumbbar-inner">
        <nav class="qz-crumb" aria-label="面包屑">
            <a href="/container/dashboard">Home</a>
            <i>/</i>
            <span>{{ .SystemName }}</span>
            <i>/</i>
            <b>实例控制台</b>
        </nav>
    </div>
</div>

<div class="qz-subbar">
    <div class="qz-shell qz-subbar-inner">
        <nav class="qz-tabs" aria-label="主导航">
            <a href="/container/dashboard" class="qz-tab is-active">实例控制台</a>
        </nav>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
function logout() {
    if (!confirm('确定要退出登录吗？')) return;
    localStorage.removeItem('container_hash');
    window.location.href = '/container/login';
}
</script>
{{end}}
